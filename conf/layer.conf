BBPATH .= ":${LAYERDIR}"
BBFILES += "\
            ${LAYERDIR}/meta*/recipes-*/*/*.bb \
            ${LAYERDIR}/meta*/recipes-*/*/*.bbappend \
            ${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend \
           "

BBFILE_COLLECTIONS += "cmf-bananapi"
BBFILE_PATTERN_cmf-bananapi := "^${LAYERDIR}/"

LAYERDEPENDS_cmf-bananapi = "cmf-filogic"
LAYERDEPENDS_cmf-bananapi_append = " filogic"

require ${@bb.utils.contains('DISTRO_FEATURES', 'em_extender','conf/distro/include/rdk-bpi-ap-extender.inc','conf/distro/include/rdk-bpi.inc', d)}
require ${@bb.utils.contains('DISTRO_FEATURES', 'em_extender','conf/include/rdk-bpi-ap-extender-bbmasks.inc','conf/include/rdk-bpi-bbmasks.inc', d)}

# EasyMesh WPS for both gateway and extender. Controller builds get
# UWM_CTRL_WPS_SUPPORT; extender builds get UWM_EXT_WPS_SUPPORT.
require conf/distro/include/em-wps-support.inc

LAYERSERIES_COMPAT_cmf-bananapi = " kirkstone"

MIDDLEWARE_ARCH = "${MACHINE}"
PACKAGE_EXTRA_ARCHS_append = " ${MIDDLEWARE_ARCH}"
