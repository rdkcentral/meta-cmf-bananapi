#@TYPE: Machine
#@NAME: bananapi4-rdk-broadband
#@NEEDED_BSPLAYERS: meta-cmf-bananapi
#@DESCRIPTION: Machine configuration for running a RDK broadband on Banana Pi R4
#@RDK_FLAVOR: rdkb

require ${@bb.utils.contains('DISTRO_FEATURES','kernel6-12','conf/machine/filogic880-kernel6-12-bpi-r4.conf', bb.utils.contains('DISTRO_FEATURES','kernel6-6','conf/machine/filogic880-kernel6-6-bpi-r4.conf','conf/machine/filogic880-bpi-r4.conf',d),d)}

require conf/distro/include/rdk-bpi.inc 
PREFERRED_PROVIDER_hal-wifi_onewifi = "hal-wifi-generic"
MACHINE_IMAGE_NAME = "${@bb.utils.contains('DISTRO_FEATURES','BuildFromTip','rdkb-generic-ci-em-ctrl-broadband-image', bb.utils.contains('DISTRO_FEATURES','EasyMesh','rdkb-generic-em-ctrl-broadband-image','rdkb-generic-broadband-image',d),d)}"
MACHINEOVERRIDES .= ":mt7988"

#SDCARD supported changes.
MACHINEOVERRIDES .="${@bb.utils.contains('DISTRO_FEATURES','sdmmc',':sd','',d)}"
IMAGE_FSTYPES += "${@bb.utils.contains('DISTRO_FEATURES','sdmmc',' wic.bz2 ext4','',d)}"
KERNEL_DEVICETREE_mt7988_bpi4_sd = "${@bb.utils.contains_any('DISTRO_FEATURES','kernel6-6 kernel6-12','mediatek/mt7988a-bananapi-bpi-r4.dtb','mediatek/mt7988a-bananapi-bpi-r4-sd.dtb', d)}"

WKS_FILE = "${@bb.utils.contains_any('DISTRO_FEATURES', 'kernel6-6 kernel6-12', 'sdimage-Bananapi_6-6.wks', 'sdimage-Bananapi.wks', d)}"
IMAGE_BOOT_FILES = "${@bb.utils.contains('DISTRO_FEATURES','sdmmc', bb.utils.contains_any('DISTRO_FEATURES','kernel6-6 kernel6-12','mt7988a-bananapi-bpi-r4.dtb ${KERNEL_IMAGETYPE}','mt7988a-bananapi-bpi-r4-sd.dtb ${KERNEL_IMAGETYPE}', d),'',d)}"
do_image_wic[recrdeps] = "do_build"
#SDCARD supported Pre build bootloader
do_image_wic[depends] += " atf_bootloader_prebuild:do_deploy"

#RUST support for EasyMesh
RUST_PANIC_STRATEGY="${@bb.utils.contains('DISTRO_FEATURES','EasyMesh','abort','',d)}"

#removing itb-image class for kernel6-6
KERNEL_CLASSES_remove = "${@bb.utils.contains_any('DISTRO_FEATURES','kernel6-12 kernel6-6','itb-image','',d)}"
