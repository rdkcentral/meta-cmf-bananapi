# 
# Core Netfilter Configuration 
# 
CONFIG_NETFILTER=y
CONFIG_NETFILTER_ADVANCED=y
CONFIG_NETFILTER_NETLINK=y
CONFIG_NETFILTER_NETLINK_QUEUE=y
CONFIG_NETFILTER_NETLINK_LOG=y
CONFIG_NF_CONNTRACK=y
CONFIG_NF_CONNTRACK_MARK=y
CONFIG_NF_CT_PROTO_GRE=m
CONFIG_NF_CT_PROTO_SCTP=m
CONFIG_NF_CT_PROTO_UDPLITE=m
CONFIG_NF_CONNTRACK_AMANDA=m
CONFIG_NF_CONNTRACK_FTP=m
CONFIG_NF_CONNTRACK_H323=m
CONFIG_NF_CONNTRACK_IRC=m
CONFIG_NF_CONNTRACK_NETBIOS_NS=m
CONFIG_NF_CONNTRACK_PPTP=m
CONFIG_NF_CONNTRACK_SANE=m
CONFIG_NF_CONNTRACK_SIP=m
# NF_CONNTRACK_TFTP: set to =y in iptables_nf.cfg (built-in). Do not set here.
CONFIG_NF_CT_NETLINK=m
CONFIG_NETFILTER_XT_MATCH_STRING=y

#
# IP: Netfilter Configuration
#
# NF_DEFRAG_IPV4: auto-selected by NF_CONNTRACK, leave kernel to select
# NF_CONNTRACK_IPV4: removed in 5.17 — do not set
# NF_CONNTRACK_PROC_COMPAT: removed in 5.16 — do not set
CONFIG_IP_NF_IPTABLES=y
# NEW in 6.12 — REQUIRED for iptables CLI compatibility
CONFIG_IP_NF_IPTABLES_LEGACY=y
CONFIG_IP_NF_MATCH_AH=m
CONFIG_IP_NF_MATCH_ECN=m
CONFIG_IP_NF_MATCH_TTL=m
CONFIG_IP_NF_FILTER=y
CONFIG_IP_NF_TARGET_REJECT=y
CONFIG_IP_NF_TARGET_TRIGGER=m
# IP_NF_TARGET_ULOG: removed upstream — do not set. Use NFLOG.
CONFIG_NF_NAT=y
# NF_NAT_NEEDED: removed in 5.16 — do not set
# NF_NAT_IPV4: removed in 5.16, merged into NF_NAT — do not set
CONFIG_IP_NF_NAT=y
CONFIG_IP_NF_TARGET_MASQUERADE=y
CONFIG_IP_NF_TARGET_NETMAP=y
CONFIG_IP_NF_TARGET_REDIRECT=y
CONFIG_NF_NAT_SNMP_BASIC=m
CONFIG_NF_NAT_FTP=m
CONFIG_NF_NAT_IRC=m
CONFIG_NF_NAT_TFTP=m
CONFIG_NF_NAT_AMANDA=m
CONFIG_NF_NAT_PPTP=m
CONFIG_NF_NAT_H323=m
CONFIG_NF_NAT_SIP=m
CONFIG_IP_NF_MANGLE=m
# IP_NF_TARGET_CLUSTERIP: removed upstream — do not set
CONFIG_IP_NF_TARGET_ECN=m
CONFIG_IP_NF_TARGET_TTL=m
CONFIG_IP_NF_RAW=y
CONFIG_IP_NF_ARPTABLES=m
CONFIG_IP_NF_ARPFILTER=m
CONFIG_IP_NF_ARP_MANGLE=m
# NEW in 6.12 — flow offload netlink control
CONFIG_NF_FLOW_TABLE_NETLINK=y
