CONFIG_USB=y
CONFIG_USB_COMMON=y
CONFIG_USB_STORAGE=y
CONFIG_USB_SUPPORT=y
CONFIG_USB_NET_DRIVERS=y
CONFIG_USB_USBNET=y
CONFIG_USB_XHCI_HCD=y
CONFIG_USB_XHCI_MTK=y
CONFIG_MTD_UBI=n
CONFIG_I2C_MUX=y
CONFIG_I2C_MUX_PCA954x=y
CONFIG_SFP=y
CONFIG_BLK_DEV_NVME=y
CONFIG_NVME_FC=y
CONFIG_NVME_TARGET=y
# HW RNG: renamed from HW_RANDOM_MTK to HW_RANDOM_MTK_V2 in 6.12 
CONFIG_HW_RANDOM_MTK_V2=y
# Scheduler: renamed from SCHED_THERMAL_PRESSURE in 6.12
CONFIG_SCHED_HW_PRESSURE=y
#New Airoha AN8811HB PHY (replaces EN8811H driver in 6.12) 
CONFIG_AIR_AN8811HB_PHY=y
# MT7988 PCIe PHY — now requires explicit enable in 6.12 
CONFIG_PHY_MTK_PCIE=y
# MT7988 CCI dynamic frequency scaling
CONFIG_PM_DEVFREQ=y
CONFIG_ARM_MEDIATEK_CCI_DEVFREQ=y
CONFIG_DEVFREQ_GOV_PASSIVE=y
CONFIG_PM_DEVFREQ_EVENT=y
# MTD: MSTC boot partition split (6.12 MT7988 BSP) 
CONFIG_MTD_SPLIT_MSTC_BOOT=y
# Security: SECCOMP now a separate symbol in 6.12 (was implicit) 
CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y
# Stack protection: per-task canary (ARM64 feature in 6.12)
CONFIG_STACKPROTECTOR=y
CONFIG_STACKPROTECTOR_PER_TASK=y 
# FUSE: required for container overlayfs rootfs (DAC/Dobby stack) 
CONFIG_FUSE_FS=y
CONFIG_FS_STACK=y
# CFS bandwidth: enables CPU quota for AiMLOps inference containers
CONFIG_CFS_BANDWIDTH=y
CONFIG_GROUP_SCHED_WEIGHT=y
# U-Boot env NVMEM layout (6.12 feature — useful for boot param access) 
CONFIG_NVMEM_LAYOUT_U_BOOT_ENV=y
# MTK Device APC (bus access control, security hardening)
CONFIG_MTK_DEVAPC=y
# AS21XXX PHY support (new in 6.12 BSP)
CONFIG_AS21XXX_PHY=y
# PCIE ASPM policy: review if EM05-G cellular latency is affected
# Default in 6.12 is POWER_SUPERSAVE; uncomment to restore PERFORMANCE: 
#CONFIG_PCIEASPM_PERFORMANCE=y
# CONFIG_PCIEASPM_POWER_SUPERSAVE is not set
CONFIG_MEMCG_V1=y
CONFIG_CPUSETS_V1=y
